[project]
name = "keikaku"
version = "0.1.0"
description = "keikaku, the translation house inside Fortleben: Japanese public-domain literature into English on Meta's models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
]

[project.scripts]
keikaku = "house.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["house"]

[tool.pytest.ini_options]
testpaths = ["tests"]
